name: Dependency Confusion Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Process one organization
        run: |
          if [ ! -f data/org.txt ] || [ ! -s data/org.txt ]; then
            echo "No organizations left in data/org.txt"
            exit 0
          fi

          if [ ! -f data/cookie.txt ]; then
            echo "cookie.txt not found in data/"
            exit 1
          fi

          # Take the first org
          RAW=$(head -n 1 data/org.txt)
          ORG=$(echo "$RAW" | tr -d '\r' | xargs)

          if [ -z "$ORG" ]; then
            echo "Empty line, cleaning up..."
            sed -i '1d' data/org.txt
            exit 0
          fi

          echo "========================================"
          echo "Scanning organization: $ORG"
          echo "========================================"

          # Remove the org from the list BEFORE scanning
          # (so it won't be scanned again even if the job fails later)
          sed -i '1d' data/org.txt

          # Run the scanner for this single org
          python tools/dependency_confusion_scanner.py \
            -org "$ORG" \
            -c data/cookie.txt \
            -o vulnerable-packages.txt || {
              echo "Scanner failed for $ORG (org already removed from list)"
            }

      - name: Commit updated org list + results
        run: |
          git config --global user.name "system"
          git config --global user.email "system@noreply.github.com"

          git add data/org.txt

          if [ -f vulnerable-packages.txt ]; then
            git add vulnerable-packages.txt
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: scanned org and updated list" -q
            git push origin main -q
          else
            echo "Nothing to commit"
          fi
