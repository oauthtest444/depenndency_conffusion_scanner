name: Dependency Confusion Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner for all orgs
        run: |
          if [ ! -f data/org.txt ] || [ ! -s data/org.txt ]; then
            echo "No organizations found in data/org.txt"
            exit 0
          fi

          if [ ! -f data/cookie.txt ]; then
            echo "cookie.txt not found in data/"
            exit 1
          fi

          python tools/dependency_confusion_scanner.py \
            -l data/org.txt \
            -c data/cookie.txt \
            -o vulnerable-packages.txt

      - name: Commit results (optional)
        run: |
          git config --global user.name "system"
          git config --global user.email "system@noreply.github.com"

          if [ -f vulnerable-packages.txt ] && [ -s vulnerable-packages.txt ]; then
            git add vulnerable-packages.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: update dependency confusion scan results" -q
              git push origin main -q
            fi
          fi
