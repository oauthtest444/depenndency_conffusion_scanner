name: Dependency Confusion Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Make script executable
        run: chmod +x tools/dependency_confusion_scanner.py

      - name: Run scanner for all orgs
        run: |
          if [ ! -f data/org.txt ] || [ ! -s data/org.txt ]; then
            echo "No organizations found in data/org.txt"
            exit 0
          fi

          if [ ! -f data/cookie.txt ]; then
            echo "cookie.txt not found in data/"
            exit 1
          fi

          # Clear previous results (optional)
          > vulnerable-packages.txt

          while IFS= read -r ORG || [ -n "$ORG" ]; do
            # Clean the org name (remove CR/LF and whitespace)
            ORG=$(echo "$ORG" | tr -d '\r' | xargs)

            if [ -z "$ORG" ]; then
              continue
            fi

            echo "========================================"
            echo "Scanning organization: $ORG"
            echo "========================================"

            python tools/dependency_confusion_scanner.py \
              -org "$ORG" \
              -c data/cookie.txt \
              -o vulnerable-packages.txt || {
                echo "Scanner failed for $ORG (continuing...)"
              }
          done < data/org.txt

          echo "All organizations processed."

      - name: Commit results (optional)
        run: |
          git config --global user.name "system"
          git config --global user.email "system@noreply.github.com"

          if [ -f vulnerable-packages.txt ] && [ -s vulnerable-packages.txt ]; then
            git add vulnerable-packages.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: update dependency confusion scan results" -q
              git push origin main -q
            fi
          fi
